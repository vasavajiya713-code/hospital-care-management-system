<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - City Care Hospital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">City Care Hospital</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="#">Doctors</a></li>
      <li><a href="#">Departments</a></li>
      <li><a href="#">Appointment</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>
</header>

<section class="page-header">
  <h1>Login</h1>
</section>

<section class="login-section">
  <div class="login-box">
    <h2>Patient / Admin Login</h2>
    <form>
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" placeholder="Enter your username or email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit" class="btn">Login</button>
    </form>
    <p class="login-note">New patient? <a href="#">Register here</a></p>
    <p class="login-note">Forgot password? <a href="#">Reset it</a></p>
  </div>
</section>

<footer>
  <p>&copy; 2026 City Care Hospital. All rights reserved.</p>
</footer>

</body>
</html>
